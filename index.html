<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="description" content="YePost — savdo, ombor va hisobotlarni yagona joyda boshqarish tizimi" />
  <title>YePost — Savdo tizimi</title>
  <script>
    try {
      const theme = localStorage.getItem("yepost-theme");
      document.documentElement.dataset.theme = theme === "green" || theme === "purple" ? theme : "default";
    } catch {
      document.documentElement.dataset.theme = "default";
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
