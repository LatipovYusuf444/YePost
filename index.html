<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="description" content="YePost — savdo, ombor va hisobotlarni yagona joyda boshqarish tizimi" />
  <title>YePost — Savdo tizimi</title>
  <script>
    try {
      const theme = localStorage.getItem("yepost-theme");
      document.documentElement.dataset.theme = theme === "shisha" ? "shisha" : "default";
    } catch {
      document.documentElement.dataset.theme = "default";
    }
    // iPhone/iPad (iPadOS o'zini Mac deb ko'rsatadi): 16px dan kichik maydonga bosilganda Safari sahifani kattalashtirmasin.
    // iOS foydalanuvchining barmoq bilan kattalashtirishini baribir saqlaydi; Android'da qo'shilmaydi (u yerda kattalashtirishni o'chirardi).
    try {
      const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const meta = document.querySelector('meta[name="viewport"]');
      if (ios && meta) meta.setAttribute("content", meta.getAttribute("content") + ", maximum-scale=1");
    } catch {
      // Viewport o'zgarmasa ham ilova ishlaydi.
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
