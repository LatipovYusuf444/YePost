<!doctype html>
<!--
  Android ilovasi: sayt (https://ye-post.vercel.app) ochilmaganda APK ichidan ko'rsatiladigan sahifa (capacitor.config.ts -> server.errorPath).
  Internet tiklanishi bilan yoki "Qayta urinish" bosilganda ilova qayta yuklanadi.
-->
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aisa — aloqa yo'q</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(120% 80% at 50% 0%, #1b3f8f 0%, #0b1a3d 60%, #060e24 100%);
      color: #e8f0ff;
    }
    .karta { width: 100%; max-width: 420px; text-align: center; }
    .belgi { width: 84px; height: 84px; margin: 0 auto 24px; filter: drop-shadow(0 10px 28px rgba(36, 92, 200, .55)); }
    h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.3; }
    p { margin: 0 0 6px; font-size: 15px; line-height: 1.5; color: #b8c8e8; }
    .ru { margin-top: 14px; font-size: 13px; color: #8ea3c9; }
    button {
      margin-top: 28px; width: 100%; min-height: 52px; border: 0; border-radius: 16px;
      background: linear-gradient(180deg, #3b82f6, #245cc8); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
      box-shadow: 0 10px 24px rgba(37, 99, 235, .35);
    }
    button:disabled { opacity: .7; }
    .holat { margin-top: 14px; min-height: 20px; font-size: 13px; color: #8ea3c9; }
  </style>
</head>
<body>
  <main class="karta">
    <svg class="belgi" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="t" x1="3" y1="3" x2="60" y2="61" gradientUnits="userSpaceOnUse"><stop stop-color="#428cff"/><stop offset=".52" stop-color="#245cc8"/><stop offset="1" stop-color="#123d93"/></linearGradient>
        <linearGradient id="s" x1="9" y1="12" x2="37" y2="45" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".4" stop-color="#eef7ff"/><stop offset=".72" stop-color="#b2cce9"/><stop offset="1" stop-color="#f5faff"/></linearGradient>
        <linearGradient id="e" x1="31" y1="14" x2="44" y2="45" gradientUnits="userSpaceOnUse"><stop stop-color="#f2f8ff"/><stop offset=".43" stop-color="#98b3d6"/><stop offset="1" stop-color="#6283af"/></linearGradient>
      </defs>
      <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#t)" stroke="#8bb6fb" stroke-opacity=".6"/>
      <g transform="translate(4 6)">
        <path d="M5 45 22 8h11l18 37H40l-4-9H19l-4 9Zm17-16h11l-5.5-12Z" fill="url(#s)" fill-rule="evenodd"/>
        <path d="m33 8 18 37H40l3-4-7-15-8.5-9Z" fill="url(#e)"/>
        <path d="M19 36h17l-3-7H22Z" fill="#dcecff"/>
      </g>
    </svg>
    <h1>Internet aloqasi yo'q</h1>
    <p>Aisa serverga ulana olmadi. Wi-Fi yoki mobil internetni tekshiring.</p>
    <p>Aloqa tiklanishi bilan ilova o'zi ochiladi.</p>
    <p class="ru">Нет подключения к интернету. Приложение откроется автоматически, когда связь восстановится.</p>
    <button id="qayta" type="button">Qayta urinish / Повторить</button>
    <div id="holat" class="holat" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var ASOSIY = "https://ye-post.vercel.app/";
      var tugma = document.getElementById("qayta");
      var holat = document.getElementById("holat");
      var band = false;
      function qaytaYuklash() {
        if (band) return;
        band = true;
        tugma.disabled = true;
        holat.textContent = "Ulanmoqda… / Подключение…";
        // Native (MainActivity -> YePostQobiq): ilovani sozlangan manzildan (server.url) qayta ochadi. Zaxira: asosiy sayt.
        if (window.YePostQobiq && window.YePostQobiq.qaytaYuklash) {
          window.YePostQobiq.qaytaYuklash();
        } else {
          location.replace(ASOSIY);
        }
        setTimeout(function () { band = false; tugma.disabled = false; holat.textContent = ""; }, 8000);
      }
      tugma.addEventListener("click", qaytaYuklash);
      window.addEventListener("online", function () { setTimeout(qaytaYuklash, 800); });
      // Ba'zi telefonlarda "online" hodisasi kechikadi: har 15 soniyada tekshiriladi.
      setInterval(function () { if (navigator.onLine) qaytaYuklash(); }, 15000);
    })();
  </script>
</body>
</html>
